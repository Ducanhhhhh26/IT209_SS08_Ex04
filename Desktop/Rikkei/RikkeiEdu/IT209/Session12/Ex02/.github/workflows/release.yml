name: Release Docker Image

# Kích hoạt khi có Git Tag theo pattern v*.*.*
on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-image:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest

    # Cấp quyền ghi packages để push lên GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # Bước 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 3: Trích xuất metadata (tags, labels) từ Git Tag bằng docker/metadata-action@v5
      - name: Extract Docker metadata from Git Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tạo tag từ Git Tag (e.g. v1.0.0 -> 1.0.0 và v1.0.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Tag latest cho release mới nhất
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Bước 4: Thiết lập Docker Buildx để hỗ trợ multi-platform build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 5: Đóng gói và push Docker Image lên GHCR
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
