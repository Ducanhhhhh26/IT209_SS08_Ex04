services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # =========================
      # KRaft
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # =========================
      # Listeners
      # =========================
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # =========================
      # Cluster
      # =========================
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # =========================
      # Single-node configuration
      # =========================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:latest
    container_name: redis-1
    ports:
      - "6379:6379"
    command: redis-server --requirepass "your_secure_password"


  user-db:
    image: mysql:8.4
    container_name: user-db
    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: user-db

    volumes:
      - user-db-data:/var/lib/mysql

  product-db:
    image: mysql:8.4
    container_name: product-db
    restart: unless-stopped

    ports:
      - "3308:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: product-db

    volumes:
      - product-db-data:/var/lib/mysql

  order-db:
    image: mysql:8.4
    container_name: order-db
    restart: unless-stopped

    ports:
      - "3309:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: order-db

    volumes:
      - order-db-data:/var/lib/mysql
  inventory-db:
    image: mysql:8.4
    container_name: inventory-db
    restart: unless-stopped

    ports:
      - "3310:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: inventory-db

    volumes:
      - inventory-db-data:/var/lib/mysql

  payment-db:
    image: mysql:8.4
    container_name: payment-db
    restart: unless-stopped

    ports:
      - "3311:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: payment-db

    volumes:
      - payment-db-data:/var/lib/mysql

  notification-db:
    image: mysql:8.4
    container_name: notification-db
    restart: unless-stopped

    ports:
      - "3312:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: notification-db

    volumes:
      - notification-db-data:/var/lib/mysql


volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  notification-db-data:
